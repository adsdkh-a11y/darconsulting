name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vivia
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivia
          POSTGRES_PASSWORD: vivia
          POSTGRES_DB: vivia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vivia:vivia@localhost:5432/vivia
      VIVIA_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktZm9yLWNpLW9ubHk=
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vivia/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high severity and above)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
