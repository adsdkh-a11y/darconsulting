# Render Blueprint — one-click demo deployment (EU / Frankfurt).
# Dashboard → New → Blueprint → pick this repository and branch → Apply.
# Plan names change over time: if Render rejects one, pick the nearest paid plan in the dashboard.
databases:
  - name: vivia-db
    region: frankfurt
    plan: basic-256mb
    databaseName: vivia
    user: vivia

services:
  - type: web
    name: vivia
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./vivia/Dockerfile
    dockerContext: ./vivia
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: vivia-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vivia-db
          property: connectionString
      # 256-bit secret generated by Render. BACK IT UP: losing it makes uploaded documents unreadable.
      - key: VIVIA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /data/storage
      - key: AI_PROVIDER
        value: auto
      # Optional, add later in the dashboard: ANTHROPIC_API_KEY (AI stays off per patient until they consent).
